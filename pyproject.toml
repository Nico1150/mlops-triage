[project]
name = "mlops-triage"
version = "0.1.0"
description = "MLOps incident triage: structured extraction, RAG runbooks, tool-calling agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
mlops-triage-sync = "mlops_triage.sync.cli:main"
mlops-triage-eval = "mlops_triage.eval.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[tool.pytest.ini_options]
markers = [
    "integration: requires Ollama at localhost:11434",
]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlops_triage*"]
